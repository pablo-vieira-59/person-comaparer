<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>FaceNet Comparison</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .preview-img {
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        #loading {
            display: none;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center mb-4">Comparação Facial (FaceNet512)</h2>

            <div class="row mb-4 text-center">
                <div class="col-md-6">
                    <input class="form-control mb-3" type="file" id="file1" required>
                    <img id="preview1" class="img-fluid preview-img d-none">
                </div>

                <div class="col-md-6">
                    <input class="form-control mb-3" type="file" id="file2" required>
                    <img id="preview2" class="img-fluid preview-img d-none">
                </div>
            </div>

            <div class="text-center">
                <button id="compareBtn" class="btn btn-primary px-4">
                    Comparar
                </button>
            </div>

            <div id="loading" class="text-center mt-4">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2">Processando comparação...</p>
            </div>

            <div id="resultContainer" class="mt-4"></div>
        </div>
    </div>

    <script>
        function previewImage(input, previewId) {
            const file = input.files[0];
            const preview = document.getElementById(previewId);

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.classList.remove("d-none");
                }
                reader.readAsDataURL(file);
            }
        }

        document.getElementById("file1").addEventListener("change", function () {
            previewImage(this, "preview1");
        });

        document.getElementById("file2").addEventListener("change", function () {
            previewImage(this, "preview2");
        });

        document.getElementById("compareBtn").addEventListener("click", async function () {

            const file1 = document.getElementById("file1").files[0];
            const file2 = document.getElementById("file2").files[0];

            if (!file1 || !file2) {
                alert("Selecione as duas imagens.");
                return;
            }

            const formData = new FormData();
            formData.append("file1", file1);
            formData.append("file2", file2);

            document.getElementById("loading").style.display = "block";
            document.getElementById("resultContainer").innerHTML = "";

            try {
                const response = await fetch("/compare", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                document.getElementById("loading").style.display = "none";

                const alertClass = data.verified ? "alert-success" : "alert-danger";

                const icon = data.verified
                    ? '<i class="bi bi-check-circle-fill text-success fs-1"></i>'
                    : '<i class="bi bi-x-circle-fill text-danger fs-1"></i>';

                const resultText = data.verified ? "SIM" : "NÃO";

                document.getElementById("resultContainer").innerHTML = `
                    <div class="alert ${alertClass} text-center">
                        ${icon}
                        <h5 class="mt-3">Resultado</h5>
                        <p class="fs-5">
                            <strong>Mesma pessoa?</strong> ${resultText}
                        </p>
                        <p><strong>Distância:</strong> ${data.distance}</p>
                        <p><strong>Similaridade:</strong> ${data.similarity}%</p>
                    </div>
                `;

            } catch (error) {
                document.getElementById("loading").style.display = "none";
                alert("Erro ao comparar imagens.");
            }
        });
    </script>

</body>

</html>
